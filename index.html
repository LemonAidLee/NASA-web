<!doctype html>
<html lang="en" data-theme="deep-space" data-mode="expert">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Radar satellite maps of the 2024 Kelantan flood, 2026 Kedah paddy flooding and Kelantan this monsoon, from NASA NISAR and OPERA data." />
    <title>Radar water map</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 1 15 8 8 15 1 8Z' fill='%23b386ff'/%3E%3C/svg%3E" />
  </head>
  <body>
    <a class="skip-link" href="#panel">Skip to the side panel</a>
    <div id="app">
      <header id="topbar" class="hud-bar"></header>
      <main id="stage">
        <div id="map" tabindex="0"></div>
        <div id="compare" hidden></div>
        <div id="leftcol" class="col col-left"></div>
        <aside id="panel" class="col col-right"></aside>
        <div id="story-layer"></div>
        <div id="hint" hidden></div>
        <div id="sheet" class="sheet" data-state="peek"></div>
      </main>
      <div id="timebar"></div>
      <footer id="cursorbar" class="hud-bar"></footer>
      <div id="live" class="sr-only" aria-live="polite"></div>
      <div id="overlay-root"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
